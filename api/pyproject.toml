[project]
name = "etmdb-api"
version = "0.1.0"
description = "Ethiopian Movie Database — public REST API"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "python-slugify>=8.0",
    "pydantic-settings>=2.7",
    "aiosqlite>=0.20",
    "scalar-fastapi>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]
postgres = [
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
